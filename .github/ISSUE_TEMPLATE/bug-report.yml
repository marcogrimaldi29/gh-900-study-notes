name: Bug Report
description: Report a broken link, layout issue, or site malfunction
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.

  - type: input
    id: page
    attributes:
      label: Affected page
      description: Which URL or page is broken?
      placeholder: "e.g. /collaboration/ or the sidebar on all pages"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Bug type
      options:
        - Broken link (internal)
        - Broken link (external / resource)
        - Layout / visual issue
        - Navigation not working
        - Mobile / responsive issue
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected vs. what actually happened.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: "e.g. Chrome 125 on Windows 11, or Safari on iPhone 14"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked this isn't already reported in another open issue.
          required: true
